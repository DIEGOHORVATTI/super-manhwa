# VPS deploy (ADR-0008): the delivery service + a FlareSolverr sidecar (real
# headless Chromium) that solves Cloudflare for sources flagged hasCloudflare.
# Usage on the VPS:  docker compose up -d
# Then point the Vercel frontend at this host: set DELIVERY_SERVICE_URL on Vercel.
services:
  app:
    # Use the CI-built image, or `build:` to build locally from the repo root.
    image: ghcr.io/horvatti-digital/super-manhwa:latest
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      # The app routes hasCloudflare sources through this sidecar.
      FLARESOLVERR_URL: "http://flaresolverr:8191/v1"
      # AES-256-GCM key (sha256-derived) used to encrypt the stateless opaque
      # chapter/image tokens (manga ids are AniList ids). Loaded from .env — never
      # bake into the image. Rotate to invalidate every outstanding token at once.
      IMAGE_TOKEN_SECRET: "${IMAGE_TOKEN_SECRET:?IMAGE_TOKEN_SECRET must be set in .env}"
      # Shared secret the frontend sends as X-API-KEY. Never exposed to the
      # browser — only the Next server (RSC + same-origin proxy) holds it.
      API_KEY: "${API_KEY:?API_KEY must be set in .env}"
    restart: unless-stopped
    depends_on:
      - flaresolverr

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      LOG_LEVEL: info
    # Published to the host so a locally-run backend (bun dev:api) can reach it
    # at http://localhost:8191/v1. The dockerized app uses the internal DNS name.
    ports:
      - "8191:8191"
    restart: unless-stopped
