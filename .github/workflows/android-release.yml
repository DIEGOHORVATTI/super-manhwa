name: Android (Play Store)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Track da Play"
        required: true
        default: alpha
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      versionCode:
        description: "versionCode (vazio = número desta execução)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ inputs.versionCode || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gera o projeto Android (TWA) a partir do twa-manifest.json
        working-directory: android
        run: |
          npm install --no-save --no-package-lock @bubblewrap/core@1.25.0
          node generate.cjs build "$VERSION_CODE"

      - name: Restaura a keystore de upload
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "keystore e senha conferem, alias $KEY_ALIAS encontrado"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-twa-${{ runner.os }}-${{ hashFiles('android/twa-manifest.json') }}
          restore-keys: gradle-twa-${{ runner.os }}-

      - name: Build AAB assinado
        working-directory: android/build
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Apaga a keystore do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload do AAB
        uses: actions/upload-artifact@v4
        with:
          name: supermanhwa-aab-${{ env.VERSION_CODE }}
          path: android/build/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Envia para a Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.supermanhwa.app
          releaseFiles: android/build/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: android/whatsnew
          mappingFile: android/build/app/build/outputs/mapping/release/mapping.txt
